<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#120e1d" />
    <meta name="description" content="Sunset — maraqlı qal. Nümunə hekayələr, yeni baxışlar." />
    <title>Sunset — yeni bir baxış</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          (JSON.parse(localStorage.getItem('sunset.v2.theme') || 'null') ||
            localStorage.getItem('sunset.theme')) === 'light'
            ? 'light'
            : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
